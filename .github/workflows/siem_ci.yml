name: Lab 3 - Open-Source SIEM & Security Pipeline CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  security-validation:
    name: AI Workload SIEM Detection & Alerting Pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests opensearch-py pyyaml

      - name: Initialize Log Directories
        run: |
          mkdir -p logs/suricata logs/zeek logs/alerts
          chmod -R 777 logs

      - name: Launch Containerized SIEM Stack
        run: |
          docker compose up -d --build

      - name: Wait for OpenSearch and Gateway Health
        run: |
          echo "Waiting for OpenSearch and services to be healthy..."
          for i in {1..30}; do
            if curl -s http://localhost:9200/_cluster/health | grep -q '"status":"green"\|"status":"yellow"' && \
               curl -s http://localhost:8000/health | grep -q "ok" && \
               curl -s http://localhost:9090/health | grep -q "ok"; then
              echo "✅ Services ready!"
              break
            fi
            echo "Waiting ($i/30)..."
            sleep 4
          done

      - name: Run Adversarial Attack Suite & Verify SLA
        run: |
          python3 attack_simulation/run_all_attacks.py

      - name: Display OpenSearch Cluster State & Alerts
        if: always()
        run: |
          echo "=== OpenSearch Index Stats ==="
          curl -s http://localhost:9200/_cat/indices?v || true
          echo -e "\n=== Dispatched Webhook Alerts ==="
          curl -s http://localhost:9090/alerts/summary | python3 -m json.tool || true

      - name: Teardown Lab Environment
        if: always()
        run: |
          docker compose down -v --remove-orphans
